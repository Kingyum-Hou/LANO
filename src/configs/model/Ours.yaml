_target_: model_interface.OursModule
params_model:
  name: Ours
  input_size: 10
  output_size: 1
  ntrain: ${datamodule.n_train_test[0]}
  ntest:  ${datamodule.n_train_test[1]}
  scale_factor: 2.
  ref: 8
  hidden_size: 256
  head_size: 32
  heads_num: 8
  kernel_layers: 8
  feature_basis_num: 256
  alpha: 0.0025
  t: 10

params_optim: ${optim}

params_scheduler: ${scheduler}

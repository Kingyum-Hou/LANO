_target_: model_interface.TransolverProModule
params_model:
  name: TransolverPro
  input_channel: 10
  space_dim: ${datamodule.space_size}
  output_channel: 1
  ntrain: ${datamodule.n_train_test[0]}
  ntest:  ${datamodule.n_train_test[1]}
  ref: 8
  downsample: ${datamodule.downsample}
  unified_pos:  true
  Time_Input:   false
  slice_num:    32
  num_layers:   8
  num_heads:    8
  head_dim:     32
  hidden_size:  256
  mlp_ratio:    1
  t: 10
  alpha: 1e-4

  
params_optim:     ${optim}
params_scheduler: ${scheduler}

_target_: model_interface.IPOTModule
params_model:
  name: IPOT
  position_encoding_type: pos2fourier
  input_channel: 10
  pos_channel:   2
  num_bands:      [12, 12]
  max_resolution: [20, 20]
  num_latents:    512
  latent_channel: 128
  cross_heads_num:     1 
  cross_heads_channel: 128
  self_per_cross_attn: 2
  self_heads_channel:
  self_heads_num: 4
  ff_mult: 2
  output_channel: 1
  output_scale:   0.1
  latent_init_scale:   0.02
  ref: 8
  hidden_size:
  latent_num:
  token_Mixer:
  ntrain: ${datamodule.params_data.n_train_test[0]}
  ntest:  ${datamodule.params_data.n_train_test[1]}
  monitor: train/full_loss
  patch_size: ${datamodule.params_data.patch_size}
  patch_num: ${datamodule.params_data.patch_num}
params_optim: ${optim}
params_scheduler: ${scheduler}